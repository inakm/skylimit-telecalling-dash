<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accounts Receivable — Skylimit Telecalling</title>
  <meta name="description" content="Accounts receivable aging dashboard for Skylimit Telecalling — track outstanding balances, aging buckets, call customers, and manage collections." />
  <meta name="keywords" content="Skylimit, telecalling, accounts receivable, outstanding, aging, collections, payments, follow-up" />
  <meta property="og:title" content="Accounts Receivable — Skylimit Telecalling" />
  <meta property="og:description" content="Advanced receivables dashboard for telecallers — call customers, track promises, manage follow-ups, and recover outstanding payments." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="https://inakm.github.io/outward-dashboard/assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="top-nav">
    <a class="nav-brand" href="index.html">
      <img class="brand-logo" src="https://inakm.github.io/outward-dashboard/assets/images/logo.png" alt="Skylimit" />
      Skylimit
    </a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="quotations.html">Quotations</a>
      <a class="nav-link active" href="receivables.html">Receivables</a>
      <a class="nav-link" href="https://inakm.github.io/outward-dashboard/">Outward Dashboard</a>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <div>
        <p class="eyebrow">Finance</p>
        <h1 class="page-title">Accounts Receivable</h1>
        <p class="page-desc">Outstanding balances, aging buckets, and collections at a glance.</p>
      </div>
      <div class="page-actions">
        <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.xlsx,.xls,.ods" hidden />
        <button class="btn btn-secondary" id="uploadBtn" title="Upload CSV or Excel file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload file
        </button>
        <button class="btn btn-secondary btn-icon" id="refreshBtn" title="Refresh from Google Sheets" aria-label="Refresh from Google Sheets">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <span id="lastUpdated" class="badge badge-neutral">Not loaded</span>
      </div>
    </div>

    <div id="statusBanner"></div>

    <div id="dashboard"></div>
  </main>

  <footer class="site-footer">
    Dashboard developed &amp; maintained by <a href="https://inakm.github.io" target="_blank" rel="noopener">AKM</a> &amp; <a href="https://f9xr.github.io" target="_blank" rel="noopener">F9XR Team</a>
  </footer>

  <div class="chart-tooltip"></div>

  <button id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>

  <script>
    (function() {
      var btn = document.getElementById('backToTop');
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) btn.classList.add('visible');
        else btn.classList.remove('visible');
      });
      btn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/receivables.js"></script>
</body>
</html>
